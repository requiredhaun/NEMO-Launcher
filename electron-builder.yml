appId: com.nema.launcher
productName: NEMO
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: NEMO
